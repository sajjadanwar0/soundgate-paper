[project]
name = "exposure"
version = "0.1.0"
description = "E-EXPOSURE: measure how often real models emit gated+ungated parallel tool calls (keyed; separate from the keyless probes/)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sajjad Khan" }]
dependencies = [
    "openai>=2,<3",
    "anthropic>=0.40",
]

[project.scripts]
exposure-run = "exposure.runner:main"
exposure-analyze = "exposure.analyze:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exposure"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true