[package]
name = "soundgate"
version = "0.1.3"
edition = "2024"
description = "Environment-external effect gate for agent-framework stop primitives"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openraft           = { version = "=0.8.4", features = ["serde"], optional = true }
sled               = { version = "0.34",                          optional = true }
async-trait        = { version = "0.1",                           optional = true }
reqwest            = { version = "0.12", features = ["json"],     optional = true }
tokio              = { version = "1",    features = ["full"],     optional = true }
axum               = { version = "0.8",  features = ["macros"],   optional = true }
tracing            = { version = "0.1",                           optional = true }
tracing-subscriber = { version = "0.3",  features = ["env-filter"], optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }

proptest = { version = "1", optional = true }

[features]
conformance = []
proptest-tests = ["dep:proptest"]
replication = [
    "dep:openraft", "dep:sled", "dep:async-trait", "dep:reqwest",
    "dep:tokio", "dep:axum", "dep:tracing", "dep:tracing-subscriber",
]
python = ["dep:pyo3"]


[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
clap = "=4.4.18"
half = "=2.2.1"

[[bench]]
name = "admission"
harness = false

[profile.release]
opt-level = 2

[[bin]]
name = "soundgate_raft"
path = "src/bin/soundgate_raft.rs"
required-features = ["replication"]

[target.'cfg(loom)'.dependencies]
loom = "0.7"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lib]
crate-type = ["cdylib", "rlib"]